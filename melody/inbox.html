<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>melody inbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --line: rgba(255, 255, 255, 0.06);
      --ink: #f4f4f5;
      --body: #d0d0d4;
      --muted: #8e8e96;
      --faint: #6a6a72;
      --amber: #cc7200;
      --fill: #242428;
      --hover: #1a1a1e;
      --chip: #1a1a1e;
      --font: Inter, "Noto Sans SC", "WenQuanYi Micro Hei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #050505; }
    body {
      color: var(--ink);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, textarea, input { font: inherit; color: inherit; }
    button {
      appearance: none;
      background: transparent;
      border: 0;
      cursor: pointer;
      min-width: 0;
    }
    a { color: inherit; text-decoration: none; }
    h2, h3, p { margin: 0; }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .shell { height: 100%; padding: 12px; }
    .window {
      height: 100%;
      display: grid;
      grid-template-columns: 208px 400px minmax(0, 1fr);
      background: var(--bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
    }
    .rail, .list, .reader { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
    .rail, .list { border-right: 1px solid var(--line); }
    .colhead {
      height: 44px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 600;
      letter-spacing: -0.011em;
    }
    .colhead span, .reader h2 span {
      color: var(--faint);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    .rail .colhead { padding-left: 18px; }
    .nav { display: flex; flex-direction: column; gap: 2px; padding: 8px; }
    .nav a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      padding: 0 10px;
      border-radius: 6px;
      color: #b4b4bc;
    }
    .nav a:hover { background: var(--hover); }
    .nav a[aria-current="page"] { background: var(--fill); color: #fff; }
    .badge {
      min-width: 16px;
      height: 16px;
      padding: 0 5px;
      border-radius: 8px;
      background: var(--amber);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: inline-grid;
      place-items: center;
    }
    .me {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 16px;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }
    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 600;
      flex: none;
    }
    .tone-a { background: #3a2914; color: #f0b15a; }
    .tone-c { background: #1c2838; color: #a9c0dc; }
    .tone-b { background: #2a2618; color: #e6d3a4; }
    .list > section { display: none; flex: 1; min-height: 0; flex-direction: column; }
    .shell[data-view="待我处理"] .list > section:nth-child(1),
    .shell[data-view="我发出的"] .list > section:nth-child(2),
    .shell[data-view="已完成"] .list > section:nth-child(3) { display: flex; }
    .list h2 {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.011em;
    }
    .rows { list-style: none; margin: 0; padding: 6px; overflow: auto; flex: 1; min-height: 0; }
    .row {
      width: 100%;
      border-radius: 8px;
      padding: 8px 10px 9px;
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) auto;
      column-gap: 10px;
      align-items: start;
    }
    .row:hover { background: var(--hover); }
    .row[aria-current="true"] { background: var(--fill); }
    .copy { min-width: 0; }
    .who, .subject, .preview { display: block; }
    .who, .subject {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .who { font-weight: 600; line-height: 18px; }
    .subject { margin-top: 1px; font-weight: 500; }
    .preview {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .when { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 1px; }
    .unread .who, .unread .subject { color: var(--ink); }
    .read .who, .read .subject { color: #c6c6cc; font-weight: 400; }
    .pip {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      display: inline-block;
      margin: 0 6px 1px 0;
      vertical-align: middle;
    }
    .empty { padding: 28px 16px; color: var(--faint); }
    .clip {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .reader { background: #0e0e10; }
    .reader h2 {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.011em;
    }
    .reader h2 .title {
      min-width: 0;
      overflow: hidden;
      color: var(--ink);
      font-weight: 600;
      letter-spacing: -0.011em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .scroll { overflow: auto; padding: 4px 28px 28px; flex: 1; min-height: 0; }
    .thread { max-width: 680px; }
    .from { display: flex; gap: 10px; align-items: center; padding-top: 16px; }
    .from .name { font-weight: 600; }
    .from .meta { color: var(--muted); font-size: 12px; }
    .log { list-style: none; margin: 0; padding: 0; }
    .msg {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 12px;
      padding: 16px 0;
    }
    .msg .avatar { width: 28px; height: 28px; }
    .msg-h { display: flex; align-items: baseline; gap: 8px; }
    .msg-h b { font-weight: 600; }
    .msg-h span, .msg-h time { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
    .msg p { margin: 4px 0 0; font-size: 14px; line-height: 1.65; color: var(--body); }
    .reader h3 {
      margin: 8px 0 0;
      padding: 14px 0 0;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 12px;
      font-weight: 400;
    }
    .file {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 6px 6px;
      background: var(--chip);
      border-radius: 8px;
      border: 1px solid var(--line);
    }
    .ext {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #2c2416;
      color: #e7b15a;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 600;
    }
    .file b { font-weight: 500; display: block; font-size: 12px; }
    .file small { color: var(--faint); font-size: 11px; display: block; max-width: 420px; }
    pre.attachment {
      margin: 8px 0 0;
      padding: 10px 12px;
      background: var(--chip);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--body);
      font-family: "Noto Sans Mono", ui-monospace, monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow: auto;
    }
    .composer {
      border-top: 1px solid var(--line);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .composer form { display: flex; flex: 1; gap: 8px; align-items: center; min-width: 0; }
    .composer form.plain { flex: 0 0 auto; }
    textarea, .login input {
      width: 100%;
      height: 36px;
      resize: none;
      border: 1px solid var(--line);
      background: #141416;
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--ink);
    }
    textarea::placeholder { color: var(--faint); }
    .ghost, .send {
      height: 36px;
      border-radius: 8px;
      padding: 0 12px;
      border: 1px solid var(--line);
      color: var(--body);
      background: transparent;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }
    .ghost em { font-style: normal; color: var(--faint); font-weight: 400; margin-left: 6px; }
    .ghost:hover { background: var(--hover); }
    .send {
      background: var(--amber);
      color: #fff;
      border-color: var(--amber);
      font-weight: 600;
      padding: 0 14px;
    }
    .send:hover { filter: brightness(1.08); }
    .login {
      width: min(360px, calc(100% - 48px));
      margin: 18vh auto 0;
      display: grid;
      gap: 12px;
      padding: 20px;
      background: var(--bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }
    .login label { display: grid; gap: 6px; color: var(--muted); }
    @media (max-width: 900px) {
      .shell { padding: 0; }
      .window { border: 0; border-radius: 0; grid-template-columns: 1fr; height: auto; }
      .rail, .list { border-right: 0; border-bottom: 1px solid var(--line); }
      .me { margin-top: 0; }
    }
  </style>
</head>
<body>
  __BODY__
  <script>
    if (window.EventSource && document.getElementById("signed-in")) {
      if (window.Notification && Notification.permission === "default") {
        Notification.requestPermission();
      }
      var source = new EventSource("/events");
      source.onmessage = function (event) {
        var item = JSON.parse(event.data);
        if (window.Notification && Notification.permission === "granted") {
          new Notification("melody " + item.id, {body: item.title + "，来自 " + item.sender});
        }
        location.reload();
      };
    }
  </script>
</body>
</html>
